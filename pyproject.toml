[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fractureflow"
version = "0.1.0"
description = "Borehole logs in, structural-orientation reports out — automated fracture-set analysis for geotechnical investigation."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Wansong42"},
]
keywords = [
    "rock-mechanics",
    "geotechnical-engineering",
    "structural-geology",
    "fracture",
    "discrete-fracture-network",
    "borehole",
    "point-cloud",
    "DFN",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://wansong42.github.io/fractureflow/"
Repository = "https://github.com/wansong42/fractureflow"

[tool.setuptools.packages.find]
where = ["src"]
